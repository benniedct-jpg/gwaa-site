<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>멍춘선 1939 — 행사장 3D 미리보기</title>
<meta name="description" content="2026.11.14(토) 가평뮤직빌리지 음악역 1939 행사장을 3D로 미리 걸어보세요.">
<meta name="theme-color" content="#2a1a08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a1a08;
  --paper:#f4ead2;
  --paper-2:#e8d8b8;
  --amber:#c8762a;
  --blue:#2a5a8c;
  --muted:#6a5240;
  --line:rgba(42,26,8,.18);
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none;background:#2a1a08;font-family:var(--f-body);font-size:14px;overflow:hidden}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.panel{background:var(--paper);border:1px solid var(--ink)}

/* ── 레이블 ── */
.lbl{
  position:absolute;left:0;top:0;
  pointer-events:auto;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;
  font:500 12.5px/1 var(--f-body);
  color:var(--ink);background:var(--paper);
  border:1px solid var(--ink);
  padding:4px 8px 4px 6px;
  white-space:nowrap;
  transform-origin:0 100%;
  transition:background .15s,color .15s;
}
.lbl i{width:8px;height:8px;flex:none;border:1px solid var(--ink);border-radius:50%}
.lbl:hover,.lbl.on{background:var(--ink);color:var(--paper)}
.lbl:hover i,.lbl.on i{border-color:var(--paper)}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:28px;background:var(--ink);transform:translateX(-50%)}
.lbl.on::after{background:var(--amber);width:2px}
.lbl.prize{background:#9b6208;color:#fff;border-color:#ffd040}
.lbl.prize i{background:#ffd040;border-color:#ffd040}
.lbl.prize:hover,.lbl.prize.on{background:#c8762a}
@keyframes prizeGlow{0%,100%{border-color:#ffd040}50%{border-color:#fff8b0}}
.lbl.prize{animation:prizeGlow 2s ease-in-out infinite}
body.walk .lbl::after{display:none}

/* ── 상단 헤더 ── */
#hd{
  position:absolute;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:max(10px,env(safe-area-inset-top)) 14px 10px;
  pointer-events:none;z-index:10;
}
#hd>*{pointer-events:auto}
.brand{padding:8px 12px 9px;display:grid;gap:3px}
.brand b{font:400 22px/1 var(--f-display);letter-spacing:.05em;color:var(--ink)}
.brand span{font:500 10.5px/1.3 var(--f-mono);color:var(--muted);letter-spacing:.04em}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:flex-start}
.seg{display:flex}
.seg button,.btn{background:var(--paper);border:1px solid var(--ink);padding:7px 12px;font-size:13px;font-weight:500;border-radius:0;-webkit-appearance:none}
.seg button+button{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.badge{font:600 12px/1 var(--f-mono);color:var(--amber);background:rgba(200,118,42,.12);border:1px solid rgba(200,118,42,.35);padding:5px 11px;letter-spacing:.06em;align-self:center}

/* ── 우측 info 카드 ── */
#card{
  position:absolute;right:12px;top:80px;
  width:290px;max-height:calc(100% - 200px);
  overflow:auto;z-index:10;
}
#card .strip{height:7px;border-bottom:1px solid var(--ink)}
#card .in{padding:12px 14px 15px;display:grid;gap:9px}
#card .meta{font:500 10.5px/1 var(--f-mono);letter-spacing:.05em;color:var(--muted);display:flex;justify-content:space-between}
#card h2{font:400 24px/1.1 var(--f-display);margin:0;text-wrap:balance}
#card p{margin:0;font-size:13.5px;line-height:1.65;white-space:pre-line}
#card .prize-banner{margin-top:4px;padding:8px 10px;background:rgba(200,118,42,.15);border:1px solid rgba(255,208,64,.5);font-size:13.5px;color:#7a4a00;line-height:1.5}
#card .x{position:absolute;right:8px;top:12px;background:none;border:0;font-size:18px;line-height:1;padding:4px 6px;color:var(--muted)}
#card .x:hover{color:var(--ink)}

/* ── 하단 칩 ── */
#quick{
  position:absolute;left:12px;right:12px;
  bottom:max(16px,env(safe-area-inset-bottom));
  display:flex;gap:7px;overflow-x:auto;padding:3px 0;
  pointer-events:none;scrollbar-width:none;align-items:center;z-index:10;
}
#quick::-webkit-scrollbar{display:none}
#quick>*{pointer-events:auto}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--paper);border:1px solid var(--ink);
  padding:7px 12px;font-size:13px;font-weight:500;
  white-space:nowrap;flex:none;cursor:pointer;
}
.chip i{width:8px;height:8px;border:1px solid var(--ink);flex:none}
.chip:hover,.chip.on{background:var(--ink);color:var(--paper)}
.chip.prize-chip{background:#9b6208;color:#fff;border-color:#ffd040}
.chip.prize-chip:hover{background:#c8762a}
body.walk #quick{display:none}

/* ── 힌트 ── */
#hint{
  position:absolute;right:14px;bottom:max(72px,calc(env(safe-area-inset-bottom)+56px));
  font:500 10.5px/1.6 var(--f-mono);color:rgba(244,234,210,.5);
  text-align:right;pointer-events:none;z-index:9;
  transition:opacity .4s;
}
#hint.gone,body.walk #hint{opacity:0}

/* ── 걷기 모드 UI ── */
#walkhint{
  position:absolute;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);
  display:none;padding:8px 14px;text-align:center;
  font:500 11px/1.5 var(--f-mono);letter-spacing:.02em;
  color:var(--paper);background:rgba(42,26,8,.72);border:1px solid rgba(244,234,210,.25);
  white-space:nowrap;pointer-events:none;z-index:11;
}
body.walk:not(.touch) #walkhint{display:block}
#joy{
  position:absolute;left:max(22px,env(safe-area-inset-left));
  bottom:max(34px,calc(env(safe-area-inset-bottom)+18px));
  width:124px;height:124px;border-radius:50%;
  background:rgba(244,234,210,.14);border:2px solid rgba(244,234,210,.42);
  display:none;touch-action:none;z-index:12;
}
body.walk.touch #joy{display:block}
#joyknob{
  position:absolute;left:50%;top:50%;width:54px;height:54px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:rgba(244,234,210,.9);border:2px solid var(--ink);pointer-events:none;
}

/* ── 로딩 ── */
#load{
  position:absolute;inset:0;display:grid;place-items:center;
  color:var(--paper);font:400 20px var(--f-display);letter-spacing:.1em;
  background:#2a1a08;transition:opacity .6s;z-index:20;
}
#load.done{opacity:0;pointer-events:none}

/* ── 자동투어 뱃지 ── */
#autobadge{
  position:absolute;left:50%;top:80px;transform:translateX(-50%);
  display:none;padding:7px 14px;
  font:500 11.5px var(--f-mono);letter-spacing:.04em;
  background:var(--ink);color:var(--paper);border:1px solid var(--ink);white-space:nowrap;z-index:11;
}
body.auto #autobadge{display:block}

@media(max-width:680px){
  .brand b{font-size:18px}
  .brand span{display:none}
  #card{left:12px;right:12px;top:auto;bottom:68px;width:auto;max-height:40%}
  body.walk #card{bottom:12px}
  body.walk.touch #card{left:160px;bottom:24px;max-height:34%}
  .seg button,.btn{padding:6px 10px;font-size:12px}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" tabindex="0" aria-label="멍춘선 1939 행사장 3D 지도"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <div id="hd">
    <div class="brand panel">
      <b>멍춘선 1939 행사장</b>
      <span>가평군 × GWAA · 가평뮤직빌리지 음악역 1939</span>
    </div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="보기 방식">
        <button id="mSky" aria-pressed="true">하늘에서</button>
        <button id="mMap" aria-pressed="false">지도로</button>
        <button id="mWalk" aria-pressed="false">걸어서</button>
      </div>
      <button class="btn" id="btnAuto">자동 투어</button>
      <div class="badge panel">11.14 SAT</div>
    </div>
  </div>

  <article id="card" class="panel" hidden aria-live="polite">
    <div class="strip" id="cardStrip"></div>
    <button class="x" id="cardX" aria-label="닫기">×</button>
    <div class="in">
      <div class="meta"><span id="cardMeta">장소 안내</span></div>
      <h2 id="cardName">—</h2>
      <p id="cardDesc"></p>
      <div class="prize-banner" id="cardPrize" hidden></div>
    </div>
  </article>

  <div id="quick" aria-label="바로 가기">
    <span style="font:500 10.5px var(--f-mono);letter-spacing:.06em;color:rgba(244,234,210,.55);white-space:nowrap;padding-right:2px;pointer-events:none">바로 가기</span>
  </div>

  <div id="hint">끌어서 회전 · 휠/두 손가락으로 확대</div>
  <div id="walkhint">W A S D · 방향키로 이동 &nbsp;·&nbsp; 드래그로 시점 &nbsp;·&nbsp; 장소에 다가가면 안내가 떠요</div>
  <div id="joy"><div id="joyknob"></div></div>
  <div id="autobadge">자동 투어 중 · 화면을 누르면 멈춰요</div>
  <div id="load">멍춘선 1939</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
const V3 = THREE.Vector3;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ═══════════════════════════════════════════
   SPOTS — 배치도 1:1
═══════════════════════════════════════════ */
const SPOTS = [
  { id:'stage', label:'🎪 무대', icon:'🎪', color:'#2a5a8c', prize:true,
    pos:new V3(0,0,-8.2), labelY:3.4,
    name:'무대 (옛 가평역 플랫폼)',
    desc:'🎸 어쿠스틱 라이브 열차  13:30–14:30\n🐾 댕댕자랑  14:30–15:00\n❓ 댕댕 OX 퀴즈  15:00–16:30\n🎤 7080 라이브  15:30–16:30\n🎉 폐회식  16:30–17:00',
    prizeDesc:'🎁 댕댕자랑 & 댕댕 OX 퀴즈 참여자에게 선물 증정!' },
  { id:'dj', label:'🎧 DJ 부스', icon:'🎧', color:'#9b6208', prize:true,
    pos:new V3(-5.6,0,-4.2), labelY:2.6,
    name:'DJ 부스',
    desc:'☕ 신청곡  11:30–12:30\n🎯 빙고게임  12:30–13:30',
    prizeDesc:'🎁 신청곡 & 빙고게임 참여자에게 선물 증정!' },
  { id:'beanbag', label:'🛋️ 빈백 쉼터', icon:'🛋️', color:'#4a8c40',
    pos:new V3(-3,0,1.6),
    name:'빈백 쉼터',
    desc:'빈백에 기대어 음악과 함께 쉬어가세요.\n반려견과 느긋한 한때를 보내는 공간입니다.' },
  { id:'food', label:'🍔 푸드트럭', icon:'🍔', color:'#d04830',
    pos:new V3(4.2,0,-1),
    name:'푸드트럭',
    desc:'다양한 먹거리를 즐겨보세요.\n반려동물 간식도 준비되어 있습니다.' },
  { id:'booth', label:'🧪 체험부스 A–F', icon:'🧪', color:'#2a1a08',
    pos:new V3(0.4,0,9.8), labelY:2.6,
    name:'체험부스 A–F',
    desc:'A · 달고나 만들기\nB · 반려견 치약 만들기\nC · 반려견 샴푸 만들기\nD · 반려견 케이크 만들기\nE · 기초 건강검진\nF · 입양 상담\n\n무료 · 상시 운영' },
  { id:'station', label:'🎸 M 스테이션', icon:'🎸', color:'#2a1a08',
    pos:new V3(20,0,1), labelY:4.6,
    name:'M 스테이션 (음악역 1939)',
    desc:'가평뮤직빌리지 음악역 1939.\n옛 가평역사를 리모델링한 공연·전시 공간입니다.' },
  { id:'entrance', label:'🎟️ 입장부스', icon:'🎟️', color:'#7a4fb0',
    pos:new V3(10,0,6),
    name:'입장부스 · 승차권 발급',
    desc:'행사 입장 & 승차권 배부  11:00–11:30\n\n입장 무료 · 반려동물 없이도 누구나 환영' },
  { id:'book', label:'📚 책방 코너', icon:'📚', color:'#2a1a08',
    pos:new V3(9,0,14),
    name:'책방 코너',
    desc:'책을 무료로 빌려 읽고,\n소장하고 싶은 책은 중고가로 구매하세요.' },
  { id:'seller', label:'🛍️ 셀러부스', icon:'🛍️', color:'#2a1a08',
    pos:new V3(15.5,0,14),
    name:'셀러부스',
    desc:'반려동물 용품 & 소품\n로컬 셀러들이 참여합니다.' },
];

/* ═══════════════════════════════════════════
   RENDERER
═══════════════════════════════════════════ */
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({canvas, antialias:true});
} catch(e) {
  document.getElementById('load').innerHTML = '<div style="text-align:center;padding:20px;font:400 15px/1.6 var(--f-body);max-width:400px">3D를 열 수 없어요. 최신 크롬 또는 사파리에서 열어 주세요.</div>';
  throw e;
}
const isMobile = matchMedia('(pointer:coarse)').matches || innerWidth <= 760;
if(isMobile) document.body.classList.add('touch');
renderer.setPixelRatio(Math.min(devicePixelRatio||1, isMobile?1.5:2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = isMobile ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
renderer.setClearColor(0x2a1a08);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

/* ── SCENE ── */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe7f0d4, 80, 240);  // 포근한 연무

/* ── CAMERA ── */
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.3, 600);
camera.position.set(14, 46, 64);

const controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(9, 0, 2);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.45;
controls.minDistance = 6;
controls.maxDistance = 130;
controls.update();

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
window.addEventListener('resize', onResize);
onResize();

/* ── VIEWS ── */
const VIEWS = {
  sky: { pos:[14,46,64], target:[9,0,2] },
  map: { pos:[9,90,3],   target:[9,0,2] },
};
let flyAnim = null;
function flyTo(view, onDone) {
  if(reduceMotion){ camera.position.set(...view.pos); controls.target.set(...view.target); controls.update(); if(onDone) onDone(); return; }
  const start = { px:camera.position.x, py:camera.position.y, pz:camera.position.z,
                  tx:controls.target.x, ty:controls.target.y, tz:controls.target.z };
  const end = { px:view.pos[0], py:view.pos[1], pz:view.pos[2],
                tx:view.target[0], ty:view.target[1], tz:view.target[2] };
  const dur = 900, t0 = performance.now();
  if(flyAnim) cancelAnimationFrame(flyAnim);
  function step() {
    const t = Math.min((performance.now()-t0)/dur, 1);
    const e = t<.5 ? 2*t*t : -1+(4-2*t)*t;
    camera.position.set(start.px+(end.px-start.px)*e, start.py+(end.py-start.py)*e, start.pz+(end.pz-start.pz)*e);
    controls.target.set(start.tx+(end.tx-start.tx)*e, start.ty+(end.ty-start.ty)*e, start.tz+(end.tz-start.tz)*e);
    controls.update();
    if(t<1) flyAnim = requestAnimationFrame(step);
    else { flyAnim = null; if(onDone) onDone(); }
  }
  step();
}
function flyToSpot(spot, onDone) {
  const p = spot.pos;
  flyTo({ pos:[p.x+8, 13, p.z+13], target:[p.x, 0, p.z] }, onDone);
}

/* ── SKY ── */
const skyMat = new THREE.ShaderMaterial({
  uniforms:{ top:{value:new THREE.Color('#9fcdec')}, mid:{value:new THREE.Color('#dcecf2')}, bot:{value:new THREE.Color('#f7e9c6')} },
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top;uniform vec3 mid;uniform vec3 bot;varying vec3 vP;void main(){float h=clamp(vP.y*1.3+.12,0.,1.);vec3 c=h<.5?mix(bot,mid,pow(h*2.,.8)):mix(mid,top,pow((h-.5)*2.,1.1));gl_FragColor=vec4(c,1.);}',
  side:THREE.BackSide,depthWrite:false,fog:false
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(440,24,12), skyMat));

/* ── LIGHTS — 포근한 황금빛 ── */
scene.add(new THREE.HemisphereLight(0xfff3dc, 0x7fae5e, 0.82));
const sun = new THREE.DirectionalLight(0xfff0cc, 1.18);
sun.castShadow = true;
sun.shadow.mapSize.set(isMobile?1024:2048, isMobile?1024:2048);
Object.assign(sun.shadow.camera, {left:-48, right:48, top:48, bottom:-48, near:0.5, far:130});
sun.shadow.bias = -0.0012;
sun.shadow.radius = 3;
sun.position.set(16, 22, 15);
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xd6e6f0, 0.32);
fill.position.set(-10, 12, -6);
scene.add(fill);

/* ── HELPERS ── */
const Box=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const Cyl=(a,b,h,s)=>new THREE.CylinderGeometry(a,b,h,s||8);
const Sph=(r,a,b)=>new THREE.SphereGeometry(r,a||8,b||6);
const MC = {};
function mat(c, o){ const k=c+(o?JSON.stringify(o):''); return MC[k]||(MC[k]=new THREE.MeshPhongMaterial(Object.assign({color:c,flatShading:true,shininess:6,specular:0x111111},o||{}))); }
function add(geo, m, x, y, z, opt){ opt=opt||{}; const me=new THREE.Mesh(geo,m); me.position.set(x,y,z); me.castShadow=opt.cast!==false; me.receiveShadow=opt.recv!==false; (opt.p||scene).add(me); return me; }
function spriteText(txt, bg, fg, w){
  const cv=document.createElement('canvas'); w=w||64; cv.width=w; cv.height=64; const g=cv.getContext('2d');
  g.fillStyle=bg; g.strokeStyle='#2a1a08'; g.lineWidth=3;
  if(w===64){ g.beginPath(); g.arc(32,32,28,0,Math.PI*2); g.fill(); g.stroke(); }
  else { g.fillRect(2,2,w-4,60); g.strokeRect(2,2,w-4,60); }
  g.fillStyle=fg; g.font=`bold ${w<=64?30:28}px "IBM Plex Sans KR",sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(txt,w/2,34);

// 월드좌표(x,z) → Shape 좌표 (z축 반전)
function worldPoly(pts){ const s=new THREE.Shape(); pts.forEach(([x,z],i)=> i?s.lineTo(x,-z):s.moveTo(x,-z)); return s; }
function blobShape(cx,cz,rx,rz,wob,seed){
  const s=new THREE.Shape(); const N=30;
  for(let i=0;i<=N;i++){ const a=i/N*Math.PI*2;
    const r=1+Math.sin(a*3+seed)*wob+Math.cos(a*2+seed*1.7)*wob*0.5;
    const x=cx+Math.cos(a)*rx*r, z=cz+Math.sin(a)*rz*r; i?s.lineTo(x,-z):s.moveTo(x,-z); }
  return s;
}
function flat(shape,color,y){ const m=new THREE.Mesh(new THREE.ShapeGeometry(shape,20),flatMat(color)); m.rotation.x=-Math.PI/2; m.position.y=y; m.receiveShadow=true; scene.add(m); return m; }

// 크림 굽잇길 (디스크 체인)
function creamPath(points,rad){
  for(let i=0;i<points.length-1;i++){ const a=points[i],b=points[i+1];
    const d=Math.hypot(b[0]-a[0],b[1]-a[1]); const n=Math.max(1,Math.ceil(d/(rad*0.8)));
    for(let k=0;k<=n;k++){ const t=k/n;
      const g=new THREE.Mesh(new THREE.CircleGeometry(rad,16),flatMat(Ccream));
      g.rotation.x=-Math.PI/2; g.position.set(a[0]+(b[0]-a[0])*t,0.010,a[1]+(b[1]-a[1])*t); g.receiveShadow=true; scene.add(g);
    }
  }
}

function makeDog(){
  const G=new THREE.Group();
  const fur=mat('#c8803a',{shininess:8}), furD=mat('#9a5a28',{shininess:8}), cream=mat('#f0d8b0',{shininess:6});
  add(Box(1.1,0.85,1.7),fur,0,0.95,0,{p:G});
  add(Box(0.9,0.42,1.5),cream,0,0.64,0.06,{p:G,cast:false});
  // 머리
  const head=new THREE.Group(); head.position.set(0,1.55,0.95); G.add(head);
  add(Box(0.86,0.78,0.78),fur,0,0,0,{p:head});
  add(Box(0.44,0.38,0.42),cream,0,-0.12,0.46,{p:head});
  add(Sph(0.1,8,6),mat('#2a1a08'),0,-0.05,0.68,{p:head,cast:false});
  [-0.22,0.22].forEach(x=>add(Sph(0.08,8,6),mat('#2a1a08'),x,0.12,0.4,{p:head,cast:false}));
  [-0.48,0.48].forEach(x=>{ const e=add(Box(0.18,0.42,0.3),furD,x,0.28,-0.04,{p:head}); e.rotation.z=x>0?0.28:-0.28; });
  // 헤드폰
  const band=add(new THREE.TorusGeometry(0.52,0.07,6,18,Math.PI),mat('#2a5a8c',{shininess:30}),0,0.3,0,{p:head,cast:false});
  [-0.52,0.52].forEach(x=>{ const pad=add(Cyl(0.17,0.17,0.14,12),mat('#e0803a',{shininess:20}),x,0.06,0,{p:head}); pad.rotation.z=Math.PI/2; });
  // 다리
  const legs=[];
  [[-0.38,0.55],[0.38,0.55],[-0.38,-0.55],[0.38,-0.55]].forEach(([x,z])=>{
    const l=add(Box(0.27,0.62,0.3),furD,x,0.31,z,{p:G}); legs.push(l);
  });
  // 꼬리
  const tail=add(Cyl(0.06,0.13,0.62,6),fur,0,1.2,-0.95,{p:G}); tail.rotation.x=-0.8;
  G.traverse(o=>{ o.castShadow=true; });
  return {group:G, legs, tail};
}

/* ═══════════════════════════════════════════
   3인칭 걷기 컨트롤러
═══════════════════════════════════════════ */
let walkMode=false;
let camYaw=0, camPitch=0.6, camDist=13;
let walkPhase=0, lastProx=null;
const keys={};
const joyVec={x:0,y:0};

function enterWalk(){
  walkMode=true; document.body.classList.add('walk');
  controls.enabled=false; stopTour();
  const cp=dog.group.position;
  camYaw=0; camPitch=0.58; camDist=13;
  camera.position.set(cp.x, cp.y+9, cp.z+13);
  card.setAttribute('hidden','');
  document.querySelectorAll('.lbl').forEach(d=>d.classList.remove('on'));
  lastProx=null;
  canvas.focus();
}
function exitWalk(){
  if(!walkMode) return;
  walkMode=false; document.body.classList.remove('walk');
  controls.enabled=true;
  controls.target.set(dog.group.position.x, 0, dog.group.position.z);
}

function updateWalk(dt){
  const cp=dog.group.position;
  // 카메라 기준 이동축
  const fx=-Math.sin(camYaw), fz=-Math.cos(camYaw);         // 전방(화면 위)
  const rx= Math.cos(camYaw), rz=-Math.sin(camYaw);         // 우측
  let inF = (keys['w']||keys['arrowup']?1:0) - (keys['s']||keys['arrowdown']?1:0) + joyVec.y;
  let inR = (keys['d']||keys['arrowright']?1:0) - (keys['a']||keys['arrowleft']?1:0) + joyVec.x;
  inF=clamp(inF,-1,1); inR=clamp(inR,-1,1);
  let mx=fx*inF+rx*inR, mz=fz*inF+rz*inR;
  const mag=Math.hypot(mx,mz);
  let moving=false;
  if(mag>0.08){
    mx/=mag; mz/=mag; moving=true;
    const speed=7.2;
    cp.x=clamp(cp.x+mx*speed*dt, -26, 44);
    cp.z=clamp(cp.z+mz*speed*dt, -14, 19);
    // 부드러운 방향 회전
    const tgt=Math.atan2(mx,mz);
    let dy=tgt-dog.group.rotation.y;
    while(dy>Math.PI)dy-=2*Math.PI; while(dy<-Math.PI)dy+=2*Math.PI;
    dog.group.rotation.y+=dy*Math.min(1,dt*12);
  }
  // 걷기 애니메이션
  if(moving){
    walkPhase+=dt*11;
    const sw=Math.sin(walkPhase)*0.5;
    dog.legs[0].rotation.x= sw; dog.legs[3].rotation.x= sw;
    dog.legs[1].rotation.x=-sw; dog.legs[2].rotation.x=-sw;
    dog.group.position.y=Math.abs(Math.sin(walkPhase))*0.06;
    dog.tail.rotation.z=Math.sin(walkPhase*2)*0.3;
  } else {
    dog.legs.forEach(l=>l.rotation.x*=0.8);
    dog.group.position.y*=0.8;
  }
  // 카메라 추적
  const ox=Math.sin(camYaw)*Math.cos(camPitch)*camDist;
  const oy=Math.sin(camPitch)*camDist;
  const oz=Math.cos(camYaw)*Math.cos(camPitch)*camDist;
  camera.position.lerp(new V3(cp.x+ox, cp.y+oy+0.8, cp.z+oz), 0.14);
  camera.lookAt(cp.x, cp.y+1.3, cp.z);
  // 근접 안내
  let best=null,bd=1e9;
  SPOTS.forEach(s=>{ const d=Math.hypot(s.pos.x-cp.x, s.pos.z-cp.z); if(d<bd){bd=d;best=s;} });
  if(best && bd<4.2){ if(lastProx!==best.id){ lastProx=best.id; openCard(best); } }
  else if(bd>5.5){ lastProx=null; }
}

/* 조이스틱 (터치) */
const joy=document.getElementById('joy'), knob=document.getElementById('joyknob');
let joyId=null;
function joyMove(e){
  const r=joy.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=e.clientX-cx, dy=e.clientY-cy;
  const R=r.width/2-12, d=Math.hypot(dx,dy);
  if(d>R){ dx*=R/d; dy*=R/d; }
  knob.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joyVec.x=dx/R; joyVec.y=-dy/R;
}
joy.addEventListener('pointerdown',e=>{ joyId=e.pointerId; joy.setPointerCapture(e.pointerId); joyMove(e); e.preventDefault(); });
joy.addEventListener('pointermove',e=>{ if(e.pointerId===joyId) joyMove(e); });
function joyEnd(e){ if(joyId===null)return; joyId=null; joyVec.x=0; joyVec.y=0; knob.style.transform='translate(-50%,-50%)'; }
joy.addEventListener('pointerup',joyEnd);
joy.addEventListener('pointercancel',joyEnd);

/* ═══════════════════════════════════════════
   자동 투어
═══════════════════════════════════════════ */
const TOUR_IDS=['entrance','booth','dj','beanbag','food','stage','book','seller','station'];
const TOUR=TOUR_IDS.map(id=>SPOTS.find(s=>s.id===id)).filter(Boolean);
let tourIdx=0, tourTimer=null, isTour=false;
function startTour(){
  exitWalk(); press('mSky');
  isTour=true; document.body.classList.add('auto');
  document.getElementById('btnAuto').setAttribute('aria-pressed','true');
  tourIdx=0; runTour();
}
function stopTour(){
  isTour=false; document.body.classList.remove('auto');
  document.getElementById('btnAuto').setAttribute('aria-pressed','false');
  if(tourTimer){ clearTimeout(tourTimer); tourTimer=null; }
}
function runTour(){
  if(!isTour||tourIdx>=TOUR.length){ stopTour(); return; }
  const spot=TOUR[tourIdx++];
  openCard(spot);
  flyToSpot(spot, ()=>{ if(isTour) tourTimer=setTimeout(runTour,2800); });
}
document.getElementById('btnAuto').addEventListener('click',function(){
  if(isTour) stopTour(); else startTour();
});

/* ═══════════════════════════════════════════
   클릭으로 스팟 선택 (orbit 모드)
═══════════════════════════════════════════ */
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
const spotMeshMap=new Map();
SPOTS.forEach(spot=>{
  const m=new THREE.Mesh(Cyl(2,2,0.5,12),new THREE.MeshBasicMaterial({visible:false}));
  m.position.copy(spot.pos); m.position.y=0.25; scene.add(m);
  spotMeshMap.set(m.uuid, spot);
});
canvas.addEventListener('click',function(e){
  if(isTour||walkMode) return;
  const rect=canvas.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const meshes=[...spotMeshMap.keys()].map(id=>scene.getObjectByProperty('uuid',id)).filter(Boolean);
  const hits=raycaster.intersectObjects(meshes);
  if(hits.length){ const spot=spotMeshMap.get(hits[0].object.uuid); if(spot){ flyToSpot(spot); setTimeout(()=>openCard(spot),300); } }
});

/* ═══════════════════════════════════════════
   RENDER LOOP
═══════════════════════════════════════════ */
let lastT=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(); const dt=Math.min((now-lastT)/1000,0.05); lastT=now;
  if(walkMode) updateWalk(dt); else controls.update();
  for(let i=0;i<clouds.length;i++){ clouds[i].position.x+=clouds[i].userData.sp*dt; if(clouds[i].position.x>96) clouds[i].position.x=-96; }
  renderer.render(scene,camera);
  updateLabels();
}
animate();

setTimeout(()=>{
  document.getElementById('load').classList.add('done');
  flyTo(VIEWS.sky);
}, 400);

})();
</script>
